[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tingyiji-notes"
version = "0.2.0"
description = "听译记：英文课堂实时转写、翻译与结构化笔记"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.70.0",
  "python-dotenv>=1.0.1",
  "sounddevice>=0.5.1",
  "PySide6>=6.8.0",
  "numpy>=1.26.0",
  "faster-whisper>=1.2.1; sys_platform != 'darwin'",
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "nvidia-cublas-cu12>=12.9; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9.10; sys_platform == 'win32'",
  "pypdf>=5.0.0",
  "python-pptx>=1.0.0",
  "python-docx>=1.1.0",
  "soundcard>=0.4.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
macos = [
  "mlx-whisper; platform_machine == 'arm64'",
  "pyinstaller>=6.10; sys_platform == 'darwin'",
]

[project.scripts]
classnote = "classnote.cli:main"
classnote-gui = "classnote.qt_gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
